name: Cross-platform offline release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "New GitHub Release tag, for example v1.3.10-offline"
        required: true
        type: string
      source_ref:
        description: "Branch, tag, or commit to build"
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: offline-release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.2"

jobs:
  go-binaries:
    name: Verify Go binaries (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            suffix: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            suffix: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            suffix: .exe
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Agent Miki
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Build and inspect Go binaries
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-binaries"
          (cd packages/cli && go build -trimpath -buildvcs=false -ldflags '-s -w' -o "$RUNNER_TEMP/go-binaries/Miki-cli-${{ matrix.target }}${{ matrix.suffix }}" .)
          (cd packages/ui/backend && go build -trimpath -buildvcs=false -ldflags '-s -w' -o "$RUNNER_TEMP/go-binaries/Miki-web-${{ matrix.target }}${{ matrix.suffix }}" .)
          test -s "$RUNNER_TEMP/go-binaries/Miki-cli-${{ matrix.target }}${{ matrix.suffix }}"
          test -s "$RUNNER_TEMP/go-binaries/Miki-web-${{ matrix.target }}${{ matrix.suffix }}"
          file "$RUNNER_TEMP/go-binaries"/*
          if [ "${{ matrix.target }}" = "linux-amd64" ]; then
            MIKI_PACKAGE_VERSION="${{ inputs.release_tag }}" "$RUNNER_TEMP/go-binaries/Miki-cli-${{ matrix.target }}" --version
          fi
      - name: Upload verified Go binaries
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries-${{ matrix.target }}
          if-no-files-found: error
          path: ${{ runner.temp }}/go-binaries/*

  build:
    name: Build ${{ matrix.platform }} offline package
    needs: go-binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
          - platform: linux-arm64
            os: ubuntu-24.04-arm
          - platform: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Agent Miki
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"

      - name: Enable MSVC developer environment
        if: matrix.platform == 'windows-x64'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux native build dependencies
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config

      - name: Install Windows native build dependencies
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress -y

      - name: Install JavaScript dependencies
        run: npm ci --ignore-scripts

      - name: Rebuild native JavaScript addons
        run: npm rebuild better-sqlite3

      - name: Test native better-sqlite3 binding
        run: npm run test:native

      - name: Configure release inputs (Linux)
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'MIKI_RELEASE_DIR=%s\n' "$RUNNER_TEMP/agent-miki-${{ matrix.platform }}-offline"
            printf 'MIKI_LLAMA_BUILD_JOBS=2\n'
          } >> "$GITHUB_ENV"

      - name: Configure release inputs (Windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          "MIKI_RELEASE_DIR=$(Join-Path $env:RUNNER_TEMP 'agent-miki-windows-x64-offline')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MIKI_LLAMA_BUILD_JOBS=2" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run repository verification
        env:
          MIKI_VERIFY_SKIP_BACKEND_TESTS: ${{ matrix.platform == 'windows-x64' && '1' || '0' }}
          MIKI_VERIFY_SKIP_LINT: "1"
          MIKI_VERIFY_SKIP_TESTS: "1"
        run: npm run verify

      - name: Build offline package
        run: npm run build:release:offline

      - name: Assert no answer or voice model is bundled (Linux)
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          test ! -d "$MIKI_RELEASE_DIR/package/runtime/models"
          ! find "$MIKI_RELEASE_DIR/package/runtime" -type f -iname '*.gguf' -print -quit | grep -q .
          test ! -d "$MIKI_RELEASE_DIR/package/runtime/voice"
          ! find "$MIKI_RELEASE_DIR/package/runtime" -type f \( -iname '*whisper*' -o -iname '*ggml-tiny*' -o -iname '*ggml-base*' -o -iname '*ggml-small*' \) -print -quit | grep -q .
          (cd "$MIKI_RELEASE_DIR" && sha256sum -c SHA256SUMS)
          cp "$MIKI_RELEASE_DIR/SHA256SUMS" "$MIKI_RELEASE_DIR/SHA256SUMS-${{ matrix.platform }}"

      - name: Verify Linux npm install and miki doctor
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          install_root="$RUNNER_TEMP/miki-install-smoke"
          rm -rf "$install_root"
          npm install --global --prefix "$install_root" "$MIKI_RELEASE_DIR/agent-miki-${{ matrix.platform }}-offline-"*.tar.gz
          PATH="$install_root/bin:$PATH" miki doctor

      - name: Assert no answer or voice model is bundled (Windows)
        if: matrix.platform == 'windows-x64'
        shell: pwsh
        run: |
          $modelDir = Join-Path $env:MIKI_RELEASE_DIR "package\runtime\models"
          if (Test-Path $modelDir) { throw "Answer-model directory was bundled" }
          $gguf = Get-ChildItem -Path (Join-Path $env:MIKI_RELEASE_DIR "package\runtime") -Filter *.gguf -Recurse -ErrorAction SilentlyContinue
          if ($gguf) { throw "Answer-model GGUF was bundled: $($gguf.FullName)" }
          $voiceDir = Join-Path $env:MIKI_RELEASE_DIR "package\runtime\voice"
          if (Test-Path $voiceDir) { throw "Voice runtime/model directory was bundled" }
          $voiceAssets = Get-ChildItem -Path (Join-Path $env:MIKI_RELEASE_DIR "package\runtime") -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'whisper|ggml-(tiny|base|small)' }
          if ($voiceAssets) { throw "Voice runtime/model assets were bundled: $($voiceAssets.FullName -join ', ')" }
          $releaseZips = Get-ChildItem -Path $env:MIKI_RELEASE_DIR -Filter 'agent-miki-windows-x64-offline-*.zip' -File
          if ($releaseZips.Count -ne 1) { throw "Expected exactly one Windows release ZIP, found $($releaseZips.Count)" }
          $zipBytes = [System.IO.File]::ReadAllBytes($releaseZips[0].FullName)
          if ($zipBytes.Length -lt 4 -or $zipBytes[0] -ne 0x50 -or $zipBytes[1] -ne 0x4B -or $zipBytes[2] -ne 0x03 -or $zipBytes[3] -ne 0x04) { throw "Windows release archive is not a valid ZIP: $($releaseZips[0].FullName)" }
          Push-Location $env:MIKI_RELEASE_DIR
          try { Get-Content .\SHA256SUMS | ForEach-Object { if ($_ -match '^([a-f0-9]{64})\s+(.+)$') { if ((Get-FileHash $Matches[2] -Algorithm SHA256).Hash.ToLower() -ne $Matches[1]) { throw "Checksum mismatch: $($Matches[2])" } } } }
          finally { Pop-Location }
          Copy-Item (Join-Path $env:MIKI_RELEASE_DIR "SHA256SUMS") (Join-Path $env:MIKI_RELEASE_DIR "SHA256SUMS-windows-x64")

      - name: Upload Linux artifacts
        if: startsWith(matrix.platform, 'linux-')
        uses: actions/upload-artifact@v4
        with:
          name: agent-miki-${{ matrix.platform }}-offline
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/agent-miki-${{ matrix.platform }}-offline/*.tgz
            ${{ runner.temp }}/agent-miki-${{ matrix.platform }}-offline/*.tar.gz
            ${{ runner.temp }}/agent-miki-${{ matrix.platform }}-offline/SHA256SUMS-${{ matrix.platform }}

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-x64'
        uses: actions/upload-artifact@v4
        with:
          name: agent-miki-windows-x64-offline
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/agent-miki-windows-x64-offline/*.tgz
            ${{ runner.temp }}/agent-miki-windows-x64-offline/agent-miki-windows-x64-offline-*.zip
            ${{ runner.temp }}/agent-miki-windows-x64-offline/SHA256SUMS-windows-x64

  publish:
    name: Publish cross-platform offline release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source for validation scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: agent-miki-*-offline
          merge-multiple: true

      - name: Validate exact release asset set and SHA256 manifests
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.release_tag }}"
          version="${version#v}"
          version="${version%-offline}"
          node scripts/validate-release-assets.mjs release-assets "$version"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find release-assets -type f \( -name 'SHA256SUMS-*' -o -name '*.tar.gz' -o -name '*.tgz' -o -name '*.zip' \) -print | sort)
          title="Agent Miki ${RELEASE_TAG} — Windows x64 + Linux x64 + Linux ARM64 offline"
          notes="This release contains separate Windows x64, Linux x64, and Linux ARM64 offline packages. The embedded Node.js runtime, dashboard, gateway, core, memory, skills, llama.cpp server executable, and production dependencies are included for each platform. No answer-model GGUF or voice-to-text runtime/model is bundled; configure user-provided local assets or use an approved audio-capable cloud model. Each platform has its own SHA256 manifest."
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists; replacing its allow-listed assets: $RELEASE_TAG"
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes "$notes"
          fi
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --latest || true
