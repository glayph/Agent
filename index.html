<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hello World — Landing Page</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="site-title">Hello, World!</h1>
      <p class="tagline">একটি সহজ, responsive ও accessible ল্যান্ডিং পেজ</p>
    </div>
  </header>

  <main class="container" id="main">
    <section aria-labelledby="welcome">
      <h2 id="welcome">স্বাগতম</h2>
      <p>এই পেজটি একটি খোলা সুত্রের নমুনা — responsive, accessible এবং হালকা।</p>
      <button id="greetBtn" class="btn">সন্তুষ্টি দেখাও</button>
      <p id="greetMsg" aria-live="polite"></p>
    </section>

    <section aria-labelledby="about">
      <h3 id="about">বিস্তারিত</h3>
      <p>এই সেকশনটি উদাহরণস্বরূপ রাখা হয়েছে যাতে structure ও semantics পরিষ্কার হয়।</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 — Hello World Landing</div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
