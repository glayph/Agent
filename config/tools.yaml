permissions:
  shell_execute:
    level: TRUSTED_FULL_ACCESS
    allow_remote: false
    workspace_only: true
    allow_system_paths: false
    max_timeout_seconds: 300
    max_output_bytes: 10485760
  file_read:
    level: TRUSTED_FULL_ACCESS
    workspace_only: true
    allow_absolute_paths: false
    max_file_size_mb: 100
  file_write:
    level: TRUSTED_FULL_ACCESS
    allow_remote: false
    workspace_only: true
    allow_absolute_paths: false
  file_delete:
    level: TRUSTED_FULL_ACCESS
    allow_remote: false
    workspace_only: true
    allow_absolute_paths: false
  computer_use:
    level: TRUSTED_FULL_ACCESS
    mouse_input: true
    accessibility_first: true
    allow_app_launch: true
    allow_screenshots: true
    allow_keyboard: true
    allow_clipboard: true
    max_observe_elements: 300
  runtime_installer:
    level: REQUIRE_APPROVAL
    allowed_languages:
      - python
      - ruby
      - rust
      - node
      - go
      - php
      - perl
      - lua
    allow_sudo: false
    max_timeout_seconds: 300
tool_state:
  tool_search_tool_regex: true
  shell_execute: true
disabled_tools: []
runtime:
  cron:
    allow_command: false
    exec_timeout_minutes: 5
  exec:
    enabled: true
    allow_remote: false
    enable_deny_patterns: true
    custom_allow_patterns: []
    custom_deny_patterns:
      - /rm\s+.*-[rRfF]+.*\s+\/
      - /rm\s+.*--no-preserve-root/
      - /mkfs(\.\w+)?\s+\/dev\//i
      - /shred\s+.*\/dev\//i
      - /wipefs\s+.*\/dev\//i
      - /dd\s+.*if=\/dev\/(zero|random|urandom).*of=\/dev\//i
    timeout_seconds: 0
  mcp:
    enabled: true
    discovery:
      enabled: true
      ttl: 5
      max_search_results: 5
      use_bm25: true
      use_regex: true
    servers: {}
web_search:
  execution_mode: local
  provider: native
  current_service: native
  prefer_native: true
  optimization:
    cache_enabled: true
    cache_ttl_ms: 300000
    snippet_chars: 420
  providers:
    - id: native
      label: Native Web Search (DuckDuckGo)
      configured: true
      current: true
      requires_auth: false
    - id: duckduckgo
      label: DuckDuckGo
      configured: true
      current: false
      requires_auth: false
    - id: searxng
      label: SearXNG (local instance)
      configured: false
      current: false
      requires_auth: false
    - id: brave
      label: Brave Search API
      configured: false
      current: false
      requires_auth: true
    - id: tavily
      label: Tavily API
      configured: false
      current: false
      requires_auth: true
    - id: serpapi
      label: SerpAPI
      configured: false
      current: false
      requires_auth: true
    - id: serper
      label: Serper API
      configured: false
      current: false
      requires_auth: true
    - id: bing
      label: Bing Web Search API
      configured: false
      current: false
      requires_auth: true
  settings:
    native:
      enabled: true
      max_results: 5
    duckduckgo:
      enabled: true
      max_results: 5
    searxng:
      enabled: false
      max_results: 5
      base_url: ''
    brave:
      enabled: false
      max_results: 5
      api_key_set: false
    tavily:
      enabled: false
      max_results: 5
      api_key_set: false
    serpapi:
      enabled: false
      max_results: 5
      api_key_set: false
    serper:
      enabled: false
      max_results: 5
      api_key_set: false
    bing:
      enabled: false
      max_results: 5
      api_key_set: false
