# Miki's callable tool surface is intentionally restricted to two
# capabilities: LLM text generation, and computer_use (mouse, keyboard,
# screen, and computer vision — the agent's "hands, feet, and eyes"). Every
# other tool that used to let the agent bypass actually using the computer
# (shell_execute, file_read/write/delete, browser DOM automation, scrape_*,
# web_search, model_*, runtime_installer, skill_*, admin_*) has been removed
# from the tool registry (see packages/core/src/tools/registry/executor.ts
# and handlers.ts) and is additionally denied here in case anything ever
# tries to re-register a tool under one of these names.
permissions:
  # Explicitly DISABLED (not just omitted) so the underlying executor
  # classes — which remain instantiated as internal infrastructure and are
  # otherwise unreachable now that their tools are unregistered — refuse to
  # run anything if ever invoked directly. See ShellExecutor.runShell() and
  # FileSecurityExecutor.isAllowed(), which both check permissions.<tool>.level
  # against a DISABLED/OFF/DENY/BLOCKED set independently of whether the
  # tool is registered with the LLM.
  shell_execute:
    level: DISABLED
  file_read:
    level: DISABLED
  file_write:
    level: DISABLED
  file_delete:
    level: DISABLED
  runtime_installer:
    level: DISABLED
  computer_use:
    level: TRUSTED_FULL_ACCESS
    mouse_input: true
    accessibility_first: true
    allow_app_launch: true
    allow_screenshots: true
    allow_keyboard: true
    allow_clipboard: true
    max_observe_elements: 300
tool_state:
  tool_search_tool_regex: true
disabled_tools:
  - shell_execute
  - file_read
  - file_write
  - file_delete
  - browser_navigate
  - browser_play_media
  - browser_click
  - browser_type
  - browser_invoke
  - browser_fill
  - browser_press
  - browser_extract
  - browser_screenshot
  - browser_scroll
  - browser_close
  - platform_connection_start
  - platform_connection_status
  - platform_connection_complete
  - platform_connection_validate
  - platform_connection_revoke
  - scrape_page
  - scrape_selectors
  - scrape_paginated
  - scrape_infinite_scroll
  - scrape_json
  - scrape_table
  - model_list
  - model_add
  - model_delete
  - model_select
  - direct_download_search
  - web_search
  - project_workflow_create
  - runtime_ensure
  - runtime_ensure_status
  - skill_search
  - skill_create
  - skill_install
  - admin_config_get
  - admin_config_validate
  - admin_config_patch
  - admin_tool_state
runtime:
  cron:
    allow_command: false
    exec_timeout_minutes: 5
  # Shell execution is fully disabled — the agent must operate the computer
  # the way a person would (via computer_use) instead of running commands
  # through a direct exec API.
  exec:
    enabled: false
    allow_remote: false
    enable_deny_patterns: true
    custom_allow_patterns: []
    custom_deny_patterns:
      - "/rm\\s+.*-[rRfF]+.*\\s+\\/"
      - "/rm\\s+.*--no-preserve-root/"
      - "/mkfs(\\.\\w+)?\\s+\\/dev\\//i"
      - "/shred\\s+.*\\/dev\\//i"
      - "/wipefs\\s+.*\\/dev\\//i"
      - "/dd\\s+.*if=\\/dev\\/(zero|random|urandom).*of=\\/dev\\//i"
    timeout_seconds: 0
  # MCP would let the agent call arbitrary external tool servers, which is
  # the same "preprogrammed command" bypass as skills — disabled.
  mcp:
    enabled: false
    discovery:
      enabled: false
      ttl: 5
      max_search_results: 5
      use_bm25: true
      use_regex: true
    servers: {}
