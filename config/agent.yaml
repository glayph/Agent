schema_version: 1
agent:
  name: Miki
  project: Miki
  persona: >
    You are Miki, বাংলা-only RULEPLAY .

    Your capabilities are strictly limited to two things: generating text
    (thinking, responding, planning) and computer_use -- operating the
    computer directly through mouse, keyboard, screenshots, and computer
    vision, the same way a person would. There is no shell_execute,
    file_read/write/delete, browser automation, web_search, or skill/plugin
    tool available to you; every action that touches the system or the
    outside world (running a command, editing a file, searching the web,
    installing something) must be done by actually operating the computer
    through computer_use -- open a terminal and type into it, open a file
    manager or editor, open a browser and click and type -- never assumed or
    shortcut through a specialized API. Use computer_use only within the
    active workspace by default, keep actions auditable, and always verify
    your results by looking at the screen. Destructive or external side
    effects require explicit approval and must never be assumed from a
    default setting.

  language: en/english
  timezone: Asia/Dhaka
  max_tokens_per_cycle: 16384
  browser:
    max_retries: 2
    clear_state_every_n_navigations: 5
    chrome_path: null
  resource:
    mode: balanced
    message_history_limit: 4
    web_search_max_calls_per_turn: 2
    max_context_chars: 12000
    system_index_limit: 6
    system_index_cache_ttl_ms: 15000
    tool_warmup_enabled: true
    quality_retry_limit: 1
  memory:
    short_term_limit: 20
    long_term_enabled: true
    auto_summarize: true
    message_retention_days: null
    vector_search_threshold: 0.5
    consolidation_batch_size: 5
    consolidation_debounce_ms: 60000
    max_context_memories: 3
    max_context_facts: 3
    max_context_chars: 4000
    prune_low_value_facts: true
    fact_prune_threshold: 0.15
    fact_prune_min_age_days: 30
    personality_enabled: true
    procedural_enabled: true
    max_context_procedures: 3
  security:
    bypass_restrictions: false
    system_access: workspace_only
    sandbox_mode: true
    risk_acceptance: false
    privileged_account_required: false
    audit_logging: true
    approval_note: >-
      Workspace-scoped access is enabled by default. The agent must verify
      boundaries and obtain explicit approval before destructive or external
      side effects.
  model_routing:
    enabled: true
    local_model: llama.cpp/gemma-4-E2B-it-Q4_0
    complex_model: gemini/gemini-3.5-flash-lite
  visual:
    screen_cooldown_seconds: 10
  tools:
    auto_approve_safe: true
    require_confirm_destructive: true
    # Require owner approval before mouse/keyboard/process actions
    # (computer_click_at, computer_invoke, computer_drag, computer_set_text,
    # computer_hotkey, computer_launch, computer_terminate_app, and
    # clipboard set/clear). Read-only computer-use actions (observe,
    # screenshot, scroll, list_*, verify, clipboard get) are unaffected.
    require_confirm_computer_use: true
self_improvement:
  enabled: true
  reflection_interval_minutes: 60
  optimization_interval_minutes: 180
  prompt_tuning_interval_minutes: 120
  max_reflections_per_day: 12
  auto_apply_optimizations: false
  guardrails:
    enabled: true
    max_prompt_drift_percent: 20
  behavior_learning:
    enabled: true
    mode: draft
    exploration_rate: 0.1
    min_samples: 3
    max_draft_notes: 3
concurrency:
  maxConcurrentTasks: 3
  maxParallelToolCalls: 8
  toolLockTimeoutMs: 30000
  taskQueueSize: 50
  schedulerIntervalMs: 100
  maxScheduledTaskAttempts: 3
  retryBaseDelayMs: 60000
  retryMaxDelayMs: 900000
  recoveryStaleAfterMs: 300000
heartbeat:
  enabled: true
  interval_seconds: 30
  auto_actions:
    enabled: false
    max_actions_per_cycle: 0
  resource_limits:
    max_tokens_per_cycle: 8192
    max_idle_minutes: 5
# Persistent autonomous goal system (packages/core/src/autonomy). Runs on top
# of the heartbeat above: when there is no user task and the agent has been
# idle past the active mode's threshold, it picks a self-generated objective,
# executes it through the normal task scheduler, and records the outcome.
# There is deliberately no action-count limit here — see AGENTS.md /
# packages/core/src/autonomy for why. `heartbeat.auto_actions.enabled` above
# is still honored as a fallback on/off switch if this block is omitted, but
# `max_actions_per_cycle` is never used to cap autonomous work.
autonomy:
  enabled: true
  mode: turbo # standard mode has been removed — turbo is the only mode.
  planning:
    enabled: true
  background_tasks:
    enabled: true
  memory_maintenance:
    enabled: true
  research:
    enabled: true
  project_maintenance:
    enabled: true
  self_evaluation:
    enabled: true
  # Optional context hints the goal catalog probes against. All optional;
  # omit any you don't need. See packages/core/src/autonomy/goal-catalog.ts.
  hints:
    projects: []
    researchTopics: []
    knowledgeTopics: []
skill_governance:
  # Moot: skills are never loaded or registered as agent tools anymore (see
  # AgentOrchestrator._loadSkillsAsync in packages/core/src/agent.ts), so
  # there is nothing left for this governance engine to validate. Left
  # present (disabled) rather than removed so the admin/launcher skill
  # inspection API this config still feeds keeps working.
  enabled: false
  validator:
    check_syntax: true
    check_dangerous_patterns: true
    test_execution: true
agents:
  defaults:
    system_access: workspace_only
    restrict_to_workspace: true
    split_on_marker: true
    max_tokens: 16384
    context_window: 0
    max_tool_iterations: 12
    summarize_message_threshold: 20
    summarize_token_percent: 75
    tool_feedback:
      enabled: true
      max_args_length: 300
      separate_messages: true
    # Adaptive Multi-Message Output System (owner spec). Unifies/extends
    # split_on_marker (Chatty Mode) and tool_feedback above into one
    # switch covering every channel (Telegram, Discord, Slack, ..., and
    # the Web UI): how many extra progress messages a turn may send, and
    # how the final answer gets chunked. See
    # packages/core/src/messaging/config.ts and
    # packages/core/src/plugins/channels/_shared/agent-response.ts.
    messaging:
      adaptive: true
      max_messages_per_response: 3
      enable_chunking: true
      enable_streaming: true
      enable_progress_messages: true
      max_chunk_length: 0 # 0 = no extra clamp beyond each channel's own hard limit
      avoid_unnecessary_messages: true
      min_ms_before_first_progress: 4000
      min_ms_between_progress: 2500
    turn_profile:
      enabled: true
      history:
        mode: default
      system_prompt:
        mode: default
      skills:
        mode: "off"
        allow: []
      tools:
        # "default" == every tool registered in the tool registry, which is
        # now only the computer_use family (see
        # packages/core/src/tools/registry/executor.ts). Not "custom" with a
        # hand-listed allow-set, so this never drifts out of sync with what
        # the registry actually exposes.
        mode: default
        allow: []
  router:
    enabled: true
    default_agent: Miki
    min_score: 2
  specialists:
    general:
      name: General Coordinator
      description: Coordinates ordinary requests and preserves conversational context.
      persona: >-
        Choose the lightest reliable path and escalate only when specialist
        evidence is strong.
      capabilities:
        - coordination
        - triage
      signals:
        - low_complexity
      complexities:
        - simple
        - standard
        - complex
      priority: 0
    engineer:
      name: Software Engineer
      description: Implements, debugs, tests, and verifies code or runtime changes.
      persona: >-
        Prefer scoped implementation, type safety, tests, and concrete
        verification evidence.
      capabilities:
        - code
        - debug
        - test
        - integration
      keywords:
        - code
        - fix
        - implement
        - refactor
        - runtime
        - test
      signals:
        - implementation_intent
        - technical_syntax
        - verification_needed
      complexities:
        - standard
        - complex
      tools:
        # shell_execute/file_read/file_write no longer exist — code work now
        # happens by operating a terminal/editor through computer_use.
        - computer_launch
        - computer_screenshot
        - computer_invoke
        - computer_set_text
      priority: 8
    researcher:
      name: Research Analyst
      description: Gathers evidence, compares options, and separates facts from inference.
      persona: Prioritize source quality, cite evidence, and avoid stale assumptions.
      capabilities:
        - research
        - compare
        - audit
      keywords:
        - latest
        - current
        - compare
        - research
        - audit
      signals:
        - verification_needed
      complexities:
        - standard
        - complex
      tools:
        # web_search/scrape_page no longer exist — research now happens by
        # opening a real browser through computer_use and reading the screen.
        - computer_launch
        - computer_screenshot
        - computer_click_at
        - computer_set_text
      priority: 4
    planner:
      name: Workflow Planner
      description: Breaks complex ecosystem goals into sequenced work with checkpoints.
      persona: >-
        Decompose complex work into explicit phases and keep verification tied
        to milestones.
      capabilities:
        - planning
        - workflow
        - architecture
      keywords:
        - architecture
        - goal
        - plan
        - roadmap
        - workflow
        - ecosystem
        - production
      signals:
        - complexity_terms
        - multi_step_language
      complexities:
        - complex
      tools:
        # project_workflow_create no longer exists — planning is pure text
        # generation; execution of the plan happens via computer_use.
        []
      priority: 6
    miki:
      name: Miki
      description: Routes every task through Miki's single-agent runtime profile.
      persona: >-
        Choose the lightest reliable path, gather only relevant context, apply
        scoped changes, and verify meaningful results before final output.
      capabilities:
        - coordination
        - triage
        - code
        - debug
        - test
        - integration
        - research
        - compare
        - audit
        - planning
        - workflow
        - architecture
      keywords:
        - architecture
        - audit
        - code
        - compare
        - current
        - fix
        - goal
        - implement
        - latest
        - plan
        - production
        - refactor
        - research
        - roadmap
        - runtime
        - test
        - workflow
      signals:
        - low_complexity
        - implementation_intent
        - technical_syntax
        - verification_needed
        - complexity_terms
        - multi_step_language
      complexities:
        - simple
        - standard
        - complex
      tools:
        # Miki's only real tools now — the full computer_use family (hands,
        # feet, and vision). See config/tools.yaml and
        # packages/core/src/tools/registry/executor.ts.
        - computer_observe
        - computer_focus
        - computer_invoke
        - computer_set_text
        - computer_hotkey
        - computer_clipboard
        - computer_launch
        - computer_verify
        - computer_screenshot
        - computer_list_processes
        - computer_get_system_info
        - computer_list_displays
        - computer_click_at
        - computer_drag
        - computer_scroll
        - computer_terminate_app
        - computer_list_windows
        - computer_grid_screenshot
      priority: 10
