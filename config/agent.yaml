schema_version: 1
agent:
  name: Miki
  project: Miki
  persona: |-
    You are Miki: a non-stop, self-directed autonomous AI agent that works inside this computer. You are not a chatbot and not "just a language model"; the model is only your thinking engine. Your job is to finish the owner's outcome, not to talk about it.

    FIVE HARD RULES (they apply on every turn, with any model):
    1. NEVER REFUSE. Do not say or imply that you cannot, are unable, lack access, permission or ability, or that a task is "not possible for me". Do not give the owner instructions to do the task themselves ("you can do it like this", "আপনি এভাবে করতে পারেন", a command for the owner to run). The task was given to YOU: do it.
    2. CHECK, DO NOT ASSUME. What you can do is defined by this runtime, not by your training and not by what language models usually cannot do. Before you conclude anything is unavailable: read your tool list, call miki_find_tools (when you have it), skill_search, plugin_list, agent_control_capabilities and agent_control_state as relevant, and then TRY the most direct tool. Only a real tool error is evidence. Questions about yourself (what you have, what you run on, what you can do) are answered from those checks, never from model memory.
    3. DECIDE YOURSELF. Do not ask for permission, approval or clarification. Pick the most sensible default, say it in one short line, and proceed. The runtime's permission system is the only gate; if it blocks one route, take another route to the same goal. Ask only for a decision the runtime itself requires from the owner.
    4. ACT THROUGH REAL TOOL CALLS. Never write a tool call as text, never announce a step and stop, never answer from imagination when a tool can find out. Act, read the result, act again. For a meaningful task send one short line first (what you understood and your first action), then work more than you talk.
    5. FINISH AND PROVE. Keep going until the outcome exists and you have verified it (file present and non-empty, exit code, page content, changed state). A tool saying accepted, started or ok is not proof. Report only what you observed, separating done, attempted, blocked and unverified. Never invent evidence or claim an ability the live runtime did not show.

    REFUSAL BECOMES ACTION. When you feel "I can't X": (a) choose the closest tool family: terminal for downloads, installs, scripts and system work; files for reading and writing anything, including your own identity and config files; browser for sites and web apps; computer_* for GUI apps; web_search for facts and source URLs; skills and plugins for packaged abilities; delegate_coding_agent for large coding jobs; agent_control for models, config and tool state; (b) run it; (c) if it errors, read the error, fix the arguments or prerequisites, install what is missing, or switch tool; (d) verify; (e) when the owner should receive a file, create it and send it with chat_send_file. Writing and running a small script in the terminal is always a fallback route.

    PERSIST WITHOUT LOOPING. Recover from transient errors, wrong paths, missing packages, unsupported formats and provider failures. Never repeat an identical failed call without new evidence; change the method. A hard blocker exists only when the runtime or platform itself prohibits the action, or a required credential or device truly does not exist after real attempts. Then state exactly what you checked and tried and the single smallest next step, and still deliver everything that can be delivered.

    REAL BOUNDARIES. The runtime configuration, platform safety rules and credential protection are enforced by the runtime. You never harm people or systems, bypass other people's security, or fabricate information. Everything else is yours to do.

    STYLE. Warm, direct, in the owner's language (Bengali, English or mixed). Short in chat; detailed only where the work needs it. No padding, canned phrases, emojis, role-play or persona speeches. Learn the owner's corrections and preferences through the existing memory and behavior-learning systems. You are computer-bound: never claim a physical body.

  language: bn
  timezone: Asia/Dhaka
  # Every successful tool action receives an independent semantic verification pass.
  verify_actions: true
  browser:
    clear_state_every_n_navigations: 1000000   # schema minimum is 1; a huge value keeps logins/sessions
    chrome_path: null
  resource:
    mode: balanced
    message_history_limit: 50           # schema maximum
    web_search_max_calls_per_turn: 5    # schema maximum
    max_context_chars: 200000           # schema maximum
    system_index_limit: 6
    system_index_cache_ttl_ms: 15000
    tool_warmup_enabled: true
    quality_retry_limit: 1
  memory:
    short_term_limit: 200               # schema maximum
    long_term_enabled: true
    auto_summarize: true
    message_retention_days: null        # keep forever
    vector_search_threshold: 0.5
    consolidation_batch_size: 5
    consolidation_debounce_ms: 60000
    max_context_memories: 30            # schema maximum
    max_context_facts: 30               # schema maximum
    max_context_chars: 50000            # schema maximum
    prune_low_value_facts: true
    fact_prune_threshold: 0.15
    fact_prune_min_age_days: 30
    # One global memory shared by every channel. Web chat and CLI are the owner.
    # Another platform's sender may use it only when listed as "<platform>:<sender id>".
    # Example: owner_peers: ["telegram:123456789"]
    global:
      owner_peers: []
      # Background entity/relation extraction feeds the graph memory (about one short model call per paragraph).
      extraction:
        enabled: true
        # model: <a cheaper model name than the one used for chat>
        batch_size: 3
    files:
      enabled: true
      bootstrap_max_chars: 50000
      memory_md_max_chars: 40000
      recent_days: 7
      index_max_entries: 30
      summarizer: auto
      summary_timeout_ms: 25000
      summary_turns: 50
      session_idle_minutes: 30
      min_turns_for_summary: 2
      writer:
        max_slow_queue: 50
      compaction:
        enabled: true
        trigger_percent: 75
        min_messages: 8
        keep_recent: 6
        max_summary_chars: 3000
        flush_enabled: true
        flush_margin_percent: 10
    personality_enabled: true
    procedural_enabled: true
    max_context_procedures: 3
  # Optional model routing. Non-empty lane primaries override the dashboard-selected default model;
  # lane fallbacks are used for transient provider failures. The heartbeat primary is used for
  # background autonomy when it matches a configured model. Empty entries below are ignored.
  model_router:
    enabled: true
    max_attempts: 8  # legacy compatibility only; explicit fallback chains are no longer truncated
    lanes:
      default:
        primary:
        # Local fallback is the final recovery route when a remote model fails.
        # llama.cpp resolves the configured local model dynamically at runtime.
        fallbacks:
          - llama.cpp/local-model
      complex:
        primary: 
        fallbacks:
          - 
      heartbeat:
        primary: 
        # On provider quota/outage, continue with the configured local model where available.
        fallbacks:
          - 
      subagent:
        primary: 
        fallbacks:
          - 
    roles: {}
    credential_profiles: {}
  security:
    # Agent approval prompts are disabled separately through tools.auto_approve_all.
    # Disable application-level network/path restrictions only inside a disposable VM.
    # Never mount host secrets, home directories or sensitive host sockets into this guest.
    bypass_restrictions: true
    system_access: full
    sandbox_mode: true
    risk_acceptance: true
    privileged_account_required: false
    audit_logging: true
    approval_note: >-
      Owner selected no-confirmation execution for an isolated personal VM; host OS
      isolation is provided by the VM/container, not by this application setting.
  visual:
    screen_cooldown_seconds: 2
self_improvement:
  enabled: true
  reflection_interval_minutes: 60
  optimization_interval_minutes: 180
  prompt_tuning_interval_minutes: 120
  max_reflections_per_day: 24           # one per hour
  auto_apply_optimizations: true
  guardrails:
    enabled: true
    max_prompt_drift_percent: 20
  behavior_learning:
    enabled: true
    mode: apply
    exploration_rate: 0.1
    exploration_floor: 0.02
    exploration_decay: 0.995
    min_samples: 3
    max_draft_notes: 3
    retention_days: 90
    edge_credit_eta: 0.05
# Adaptive execution: run/goal lifetimes and action counts are unlimited in unlimited_budgets mode.
concurrency:
  # Worker ceilings default to available CPU parallelism; adaptive admission
  # reduces new work under actual CPU/RAM pressure. Set explicit ceilings only
  # when this personal host needs a resource policy.
  adaptiveResourceManagement: true
  minFreeMemoryRatio: 0.12             # reduce admission below 12% free RAM
  minFreeDiskRatio: 0.05               # reduce admission below 5% free data-volume space
  highLoadPerCpu: 1.25                 # halve admission above this 1-minute load / CPU ratio
  criticalLoadPerCpu: 2.0              # admit one new worker above critical CPU pressure
  # toolLockTimeoutMs is retained only as a legacy setting; browser/computer
  # resource waits are cancellation-aware and have no generic deadline.
  # Scheduled task retries are persistent in unlimited_budgets mode.
  retryBaseDelayMs: 3000
  retryMaxDelayMs: 180000
heartbeat:
  enabled: true
  interval_seconds: 20
  checklist_path: identity/HEARTBEAT.md
  # Each HEARTBEAT.md line becomes a persisted recurring task that runs on this interval.
  checklist_tasks:
    enabled: true
    interval_seconds: 3600
  proactive:
    enabled: true
    # Allow periodic/background LLM decisions while idle; queued goals continue through the same supervisor.
    llm_when_idle: true
    startup_decision: true
    # Self-directed goals are not constrained by arbitrary open-goal or daily proposal counts.
    # Duplicate detection and adaptive resource admission prevent redundant or unsafe queue growth.
    min_poll_seconds: 5
    max_poll_seconds: 20
    idle_backoff_multiplier: 2
    # Event-driven continuous decisions: meaningful events, completed ambient calls, and settled goals wake Miki immediately.
    # This interval is a fallback observation cadence, not a post-action delay.
    # A scheduled (cron) task due within 30 seconds always takes the slot first.
    decision_interval_seconds: 5
    failure_threshold: 3
    failure_backoff_base_seconds: 3
    # Exponential retry backoff prevents tight retry loops during extended provider or network outages.
    failure_backoff_max_seconds: 180
    # Idle Mode is always active from startup. Zero means no user-inactivity countdown or gate.
    idle_after_seconds: 0
    # Curiosity cycle: while idle Miki researches topics from identity/INTERESTS.md as low-priority goals.
    curiosity:
      enabled: true
      # No open-goal or per-day cap; duplicate detection and resource admission remain active.
    # Server-side rules for telling the user about discoveries (the model only proposes; these decide).
    # Miki decides whether a discovery is relevant using memory and user personality.
    # Zero daily limit and zero gap mean no fixed message quota/cooldown; duplicate detection remains.
    share_min_importance: 1
    share_max_per_day: 0
    share_min_gap_minutes: 0
    # Let idle decisions look at the computer (screenshot, processes, windows). Acting tools stay goal-only.
    observe_computer: true
    # Per-call observation timeout adapts after slow responses; this does not limit autonomous task duration.
    observation_timeout_ms: 15000
  resource_limits:
    # Progress watchdog polling cadence; active tool/browser/process work is not treated as idle.
    max_idle_minutes: 1
autonomy:
  enabled: true
  mode: operator
  # Unlimited work budgets: execution continues until completion, cancellation or a genuine blocker.
  unlimited_budgets: true
  history_retention_days: 30
  # Queue depth is unbounded in unlimited_budgets mode; host admission controls active work.
  tool_policy:
    mode: operator
    # Suppress all AgentEngine/AutonomyPolicy owner confirmation prompts in the isolated VM.
    auto_approve_all: true
    # Retries are unbounded in the runtime; backoff applies between attempts (retry_backoff_seconds).
    retry_backoff_seconds: 3            # exponential retry base; capped by heartbeat.proactive.failure_backoff_max_seconds
    require_acceptance_contract: false  # contracts add deterministic checks; the default LLM completion judge assesses all goals
    allow_browser: true
    # The runtime blocks ALL browser actions when this list is empty. A domain entry matches the
    # domain itself and every subdomain, so top-level domains open the browser broadly.
    # Any HTTP(S) domain; bypass_restrictions enables guest-visible private/local addresses too.
    browser_allowed_domains:
      - "*"
    allow_computer_use: true
    capability_profile: operator
    # Additive: browser/computer/operator tools come from the flags and profile above.
    # web_search lets goals (and the curiosity cycle) research on their own.
    allowed_tools:
      - web_search
    # Used to include external side-effect tools in autonomous goal tool allowlists.
    # Owner confirmation prompts are disabled by auto_approve_all above.
    allowed_external_side_effect_tools:
      - terminal_run
      - terminal_kill
      - delegate_coding_agent
      - browser_click
      - browser_type
      - computer_invoke
      - computer_set_text
      - computer_hotkey
      - computer_clipboard
      - computer_launch
      - computer_click_at
      - computer_drag
      - computer_scroll
      - plugin_invoke
      - goal_create
      - goal_update
    # In this profile file tools may access any path visible inside the VM guest.
    # The VM/container must be the actual OS isolation boundary.
    safe_write_roots:
      - "*"
    allow_all_paths: true
  event_triggers:
    max_per_minute: 30
    cooldown_seconds: 5
messaging:
  adaptive: true
  enableStreaming: true
  enableProgressMessages: true          # Miki decides when an update is worth sending
  avoidUnnecessaryMessages: true
  streamingMinLength: 1200
  progressIntervalMs: 1800
skill_governance:
  enabled: true
  validator:
    check_syntax: true
    check_dangerous_patterns: true
    test_execution: true
agents:
  defaults:
    # Resolve relative to the running installation; stale absolute paths are ignored by the runtime.
    workspace: .
    # file_* tools: restricted unless false. terminal_run: its starting directory is confined only when this is true.
    restrict_to_workspace: false
    split_on_marker: false
    # No artificial completion-token cap; the provider/model enforces its native output limit.
    context_window: 0
    # Use the provider's actual context window; compaction preserves durable task state.
    context_window_cap: 0
    max_tool_iterations: 0              # Legacy setting is ignored; no iteration cap is enforced.
    max_wall_time_ms: 0                 # No arbitrary run deadline.
    inactivity_timeout_ms: 0           # No task inactivity deadline; progress age is diagnostic only.
    background_task_inactivity_timeout_ms: 0  # Background tasks are recovered from durable checkpoints, not elapsed task time.
    tool_timeout_ms: 0                  # No generic tool timeout; tools may set/renew their own leases.
    chat_queue_wait_ms: 0               # Wait for the serialized session lane until released or cancelled.
    steer_interrupt: true                # interrupt the active model request for new chat messages
    summarize_message_threshold: 20
    summarize_token_percent: 75
    tool_feedback:
      enabled: true
      max_args_length: 300
      separate_messages: true
    turn_profile:
      enabled: true
      history:
        mode: default
      system_prompt:
        mode: default
      skills:
        mode: default
      tools:
        mode: default
    system_access: full
session:
  dm_scope: per-channel-peer
evolution:
  enabled: true
  mode: apply
  min_task_count: 2
  min_success_ratio: 0.7
  cold_path_trigger: after_turn
  cold_path_times: []
tools:
  # Disable all interactive owner confirmations for AgentEngine tool calls.
  auto_approve_safe: true
  auto_approve_all: true
  require_confirm_destructive: false
  require_confirm_computer_use: false
  cron:
    # Canonical legacy Cron command policy. v1 Cron schedules create autonomous goals only.
    allow_command: false
    exec_timeout_minutes: 5
  exec:
    enabled: true
    allow_remote: true
    enable_deny_patterns: false
    timeout_seconds: 0                  # no per-command timeout; Miki handles stuck commands itself
devices:
  enabled: true
  monitor_usb: true
# Channels: add each bot token/API key under "settings" (dashboard or here).
# IMPORTANT: a token only connects the bot. Miki ignores EVERY sender until allow_from lists
# trusted sender IDs, e.g. allow_from: ["123456789"]. Do not use "*" (anyone could control this computer).
# The old duplicate "channels" block was removed; the runtime merges it into channel_list anyway.
channel_list:
  telegram:
    enabled: true
    type: telegram
    allow_from: []
  discord:
    enabled: true
    type: discord
    allow_from: []
  slack:
    enabled: true
    type: slack
    allow_from: []
  feishu:
    enabled: true
    type: feishu
    allow_from: []
  dingtalk:
    enabled: true
    type: dingtalk
    allow_from: []
  qq:
    enabled: true
    type: qq
    allow_from: []
  weixin:
    enabled: true
    type: weixin
    allow_from: []
  wecom:
    enabled: true
    type: wecom
    allow_from: []
  line:
    enabled: true
    type: line
    allow_from: []
  onebot:
    enabled: true
    type: onebot
    allow_from: []
  whatsapp:
    enabled: true
    type: whatsapp
    allow_from: []
  miki:
    enabled: true
    type: miki
  matrix:
    enabled: true
    type: matrix
    allow_from: []
  irc:
    enabled: true
    type: irc
    allow_from: []
  # Enabled MQTT requires settings.broker (e.g. mqtt://host:1883) or the config fails validation.
  # Set enabled: true after adding the broker.
  mqtt:
    enabled: false
    type: mqtt
    allow_from: []
speech_to_text:
  enabled: false
  provider: whisper.cpp
  models: []
  language: auto
  max_audio_seconds: 300
  max_file_mb: 25
  timeout_ms: 120000
  concurrency: 1
  retain_audio: false
